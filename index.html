<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>

    <h1>QuickNotes Manager</h1>

    <button id="load-btn">Load Notes</button>
    <p id="status"></p>

    <form id="note-form">
        <div>
            <label for="title-input">Title</label>
            <input id="title-input" type="text">
        </div>
        <div style="margin-top: 10px;">
            <label for="body-input">Body</label>
            <textarea id="body-input" rows="4"></textarea>
        </div>
        <div style="margin-top: 10px;">
            <button type="submit" id="submit-btn">Send to server</button>
        </div>
    </form>

    <ul id="notes-list"></ul>

</body>
</html>
